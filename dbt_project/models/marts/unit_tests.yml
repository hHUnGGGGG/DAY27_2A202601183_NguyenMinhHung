unit_tests:
  - name: test_fct_daily_revenue_sum_and_deduplication
    model: fct_daily_revenue
    description: "Verify completed orders aggregation and ensure customer SCD active duplication does not inflate revenue."
    given:
      - input: ref('stg_orders')
        rows:
          - {order_id: 1, customer_id: 'C0001', amount_usd: 100.0, status: 'completed', currency: 'USD', created_at: '2026-08-01 10:00:00', updated_at: '2026-08-01 10:00:00', order_date: '2026-08-01'}
          - {order_id: 2, customer_id: 'C0001', amount_usd: 70.0, status: 'completed', currency: 'USD', created_at: '2026-08-01 11:00:00', updated_at: '2026-08-01 11:00:00', order_date: '2026-08-01'}
          - {order_id: 3, customer_id: 'C0002', amount_usd: 50.0, status: 'pending', currency: 'USD', created_at: '2026-08-01 12:00:00', updated_at: '2026-08-01 12:00:00', order_date: '2026-08-01'}
      - input: ref('stg_customers')
        rows:
          - {customer_id: 'C0001', country: 'US', tier: 'gold', is_active: true, valid_from: '2026-01-01 00:00:00', valid_to: null}
          - {customer_id: 'C0001', country: 'US', tier: 'platinum', is_active: true, valid_from: '2026-06-01 00:00:00', valid_to: null}
          - {customer_id: 'C0002', country: 'VN', tier: 'basic', is_active: true, valid_from: '2026-01-01 00:00:00', valid_to: null}
    expect:
      rows:
        - {order_date: '2026-08-01', completed_order_rows: 2, daily_revenue: 170.0}
