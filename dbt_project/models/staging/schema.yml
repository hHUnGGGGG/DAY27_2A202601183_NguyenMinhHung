version: 2

models:
  - name: stg_orders
    description: Cleaned order records used by downstream marts.
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: currency
        data_tests:
          - accepted_values:
              arguments:
                values: ['USD', 'VND']
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['pending', 'completed', 'refunded', 'cancelled']
      - name: amount_usd
        data_tests:
          - not_null

  - name: stg_customers
    description: Cleaned customer dimension records.
    columns:
      - name: customer_id
        data_tests:
          - not_null
      - name: country
        data_tests:
          - not_null
      - name: tier
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['basic', 'silver', 'gold', 'vip', 'platinum', 'bronze']
